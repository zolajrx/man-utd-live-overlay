<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Football Test Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}.wrap{width:100%;height:100%;display:flex;justify-content:center}
.card{margin-top:10px;width:820px;max-width:96vw;background:rgba(10,10,13,.96);border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 14px 45px rgba(0,0,0,.4);overflow:hidden}
.top{padding:10px 18px 7px;text-align:center;background:linear-gradient(90deg,rgba(0,92,171,.20),rgba(255,255,255,.03),rgba(240,70,60,.16))}
.competition{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;opacity:.76}
.live{display:inline-flex;align-items:center;gap:6px;margin-left:8px;font-size:10px;color:#ff4b4b}.dot{width:7px;height:7px;border-radius:50%;background:#ff3030;box-shadow:0 0 8px #ff3030}
.scoreline{display:grid;grid-template-columns:1fr 190px 1fr;align-items:center;padding:12px 24px 8px}
.team{text-align:center;font-weight:800;font-size:17px}.crest{width:48px;height:48px;object-fit:contain;display:block;margin:0 auto 6px}
.score{text-align:center;font-size:40px;line-height:1;font-weight:900}.status{margin-top:7px;text-align:center;font-size:12px;font-weight:800;opacity:.75}.half{text-align:center;font-size:10px;opacity:.45;margin-top:3px}
.stats{padding:8px 18px 12px}.head{display:grid;grid-template-columns:1fr 120px 1fr;font-size:9px;text-transform:uppercase;letter-spacing:1px;opacity:.45;padding-bottom:4px}
.head span:nth-child(2){text-align:center}.head span:last-child{text-align:right}
.row{display:grid;grid-template-columns:1fr 120px 1fr;align-items:center;min-height:27px;border-top:1px solid rgba(255,255,255,.06)}
.v{font-size:12px;font-weight:800}.home{text-align:right}.away{text-align:left}.label{text-align:center;font-size:10px;opacity:.58}
.events{padding:0 18px 12px}.et{font-size:9px;text-transform:uppercase;letter-spacing:1px;opacity:.45;margin-bottom:6px}.timeline{display:flex;gap:6px;overflow:hidden;min-height:28px}
.ev{flex:0 0 auto;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.06);font-size:10px;white-space:nowrap}.goal{background:rgba(220,30,40,.2)}.card{background:rgba(255,205,40,.12)}
.footer{text-align:center;font-size:8px;opacity:.25;padding-bottom:9px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="top"><span class="competition" id="comp">MLS • LIVE TEST</span><span class="live" id="live"><i class="dot"></i> AUTO DATA</span></div>
<div class="scoreline">
<div class="team"><img class="crest" id="hlogo"><span id="hname">Vancouver Whitecaps</span></div>
<div><div class="score"><span id="hs">-</span><span> : </span><span id="as">-</span></div><div class="status" id="status">Tražim utakmicu...</div><div class="half" id="half"></div></div>
<div class="team"><img class="crest" id="alogo"><span id="aname">St. Louis City</span></div>
</div>
<div class="stats"><div class="head"><span>DOMAĆIN</span><span>STATISTIKA</span><span>GOST</span></div><div id="rows"></div></div>
<div class="events"><div class="et">LIVE DOGAĐAJI</div><div class="timeline" id="timeline"><div class="ev">Čekam podatke...</div></div></div>
<div class="footer">Automatsko osvežavanje • ESPN javni live feed • samo tekst/statistika</div>
</div></div>

<script>
const SCORE="https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard";
let eventId=null;

function clean(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function statMap(summary){
  const out=[{},{}], ts=summary?.boxscore?.teams||[];
  ts.forEach((t,i)=>(t.statistics||[]).forEach(x=>{out[i][x.name]=x.displayValue??x.value}));
  return out;
}
function row(label,a,b){
 return `<div class="row"><div class="v home">${clean(a??"—")}</div><div class="label">${label}</div><div class="v away">${clean(b??"—")}</div></div>`;
}
function val(m,names){
 for(const n of names){if(m[n]!==undefined)return m[n]}
 return null;
}
async function findGame(){
 const d=await fetch(SCORE+"?dates="+new Date().toISOString().slice(0,10),{cache:"no-store"}).then(r=>r.json());
 const games=d.events||[];
 return games.find(e=>{
   const s=(e.name||"").toLowerCase();
   return (s.includes("vancouver")&&s.includes("st. louis"))||(s.includes("vancouver")&&s.includes("st louis"));
 });
}
async function update(){
 try{
  const g=await findGame();
  if(!g){document.getElementById("status").textContent="Utakmica nije pronađena";return}
  eventId=g.id;
  const c=g.competitions?.[0], teams=c?.competitors||[];
  const h=teams.find(x=>x.homeAway==="home"), a=teams.find(x=>x.homeAway==="away");
  document.getElementById("hname").textContent=h?.team?.displayName||"Vancouver Whitecaps";
  document.getElementById("aname").textContent=a?.team?.displayName||"St. Louis City";
  document.getElementById("hs").textContent=h?.score??"0";
  document.getElementById("as").textContent=a?.score??"0";
  if(h?.team?.logo)document.getElementById("hlogo").src=h.team.logo;
  if(a?.team?.logo)document.getElementById("alogo").src=a.team.logo;
  document.getElementById("comp").textContent=(g.league?.name||"MLS")+" • LIVE";
  const st=c?.status;
  document.getElementById("status").textContent=st?.displayClock||st?.type?.shortDetail||st?.type?.detail||"LIVE";
  document.getElementById("half").textContent=st?.period?("PERIOD "+st.period):"";

  const summary=await fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/summary?event="+eventId,{cache:"no-store"}).then(r=>r.json());
  const maps=statMap(summary), x=maps[0], y=maps[1];
  document.getElementById("rows").innerHTML=[
   row("POSED",val(x,["possessionPct","possession"]),val(y,["possessionPct","possession"])),
   row("ŠUTEVI",val(x,["totalShots","shots"]),val(y,["totalShots","shots"])),
   row("ŠUTEVI U OKVIR",val(x,["shotsOnTarget"]),val(y,["shotsOnTarget"])),
   row("KORNERI",val(x,["wonCorners","corners"]),val(y,["wonCorners","corners"])),
   row("PREKRŠAJI",val(x,["foulsCommitted","fouls"]),val(y,["foulsCommitted","fouls"])),
   row("ŽUTI",val(x,["yellowCards"]),val(y,["yellowCards"])),
   row("CRVENI",val(x,["redCards"]),val(y,["redCards"]))
  ].join("");

  const plays=(summary.plays||[]).slice(-7).map(p=>{
    const t=p.text||p.shortText||p.description||"";
    const c=p.clock?.displayValue||"";
    const low=t.toLowerCase();
    const cls=/goal|gol/.test(low)?"goal":(/yellow|red|card|kart/.test(low)?"card":"");
    return `<div class="ev ${cls}">${clean(c?(c+" • "+t):t)}</div>`;
  }).join("");
  document.getElementById("timeline").innerHTML=plays||'<div class="ev">Nema događaja</div>';
  document.getElementById("live").innerHTML='<i class="dot"></i> AUTO DATA';
 }catch(e){
  document.getElementById("live").innerHTML='<i class="dot"></i> POVEZIVANJE';
 }
}
update();setInterval(update,10000);
</script>
</body></html>
